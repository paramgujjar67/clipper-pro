
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPPER PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#0b1020;color:white;
 font-family:Arial;padding:20px
}
header{text-align:center;padding:20px}
.logo{font-size:45px}
h1{color:#55a6ff;font-size:30px;margin:10px}
header p{color:#aab6ca}
.card{
 background:#18243a;padding:20px;
 border-radius:18px;margin-top:20px
}
label{display:block;margin:17px 0 10px;font-weight:bold}
input{
 width:100%;padding:15px;border-radius:10px;
 border:1px solid #52617a;background:#0b1020;
 color:white;font-size:16px
}
button{
 border:0;padding:15px;border-radius:12px;
 background:#2878ff;color:white;
 font-size:16px;font-weight:bold;cursor:pointer
}
.mainbtn{width:100%;margin-top:15px}
#player{
 width:100%;aspect-ratio:16/9;
 margin-top:20px;border:0;border-radius:12px;
 background:#000
}
.time{display:flex;gap:10px}
.time div{flex:1;min-width:0}
.quick{
 display:flex;gap:8px;margin-top:12px
}
.quick button{flex:1;padding:12px 5px;font-size:14px}
.quick button.active{background:#16a878}
#message{
 margin-top:18px;color:#66d9a3;
 text-align:center;line-height:1.5
}
footer{
 text-align:center;color:#8996aa;
 margin-top:30px;font-size:13px
}
</style>
</head>
<body>

<header>
<div class="logo">✂️</div>
<h1>CLIPPER PRO</h1>
<p>Turn Long Videos Into Shorts</p>
</header>

<div class="card">

<label>🎬 Paste YouTube Video Link</label>
<input id="video" placeholder="Paste YouTube URL">

<button class="mainbtn" onclick="loadVideo()">
LOAD VIDEO ▶
</button>

<iframe id="player"
allowfullscreen
allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture">
</iframe>

<label>⚡ Quick Clip Duration</label>

<div class="quick">
<button onclick="setDuration(15,this)">15 SEC</button>
<button onclick="setDuration(30,this)" class="active">30 SEC</button>
<button onclick="setDuration(60,this)">60 SEC</button>
</div>

<div class="time">
<div>
<label>Start Time (Seconds)</label>
<input id="start" type="number" min="0" value="0">
</div>
<div>
<label>End Time (Seconds)</label>
<input id="end" type="number" min="1" value="30">
</div>
</div>

<button class="mainbtn" onclick="previewClip()">
PREVIEW MOMENT ✂️
</button>

<p id="message">Paste a YouTube link to get started!</p>

</div>

<footer>
CLIPPER PRO © 2026<br>
Your Video. Your Moment. Your Clip.
</footer>

<script>
let videoId="";

function getVideoId(url){
 try{
  let u=new URL(url);
  let id="";

  if(u.hostname==="youtu.be"){
   id=u.pathname.split("/")[1];
  }else if(
   ["youtube.com","www.youtube.com",
   "m.youtube.com"].includes(u.hostname)
  ){
   if(u.pathname==="/watch"){
    id=u.searchParams.get("v");
   }else if(
    u.pathname.startsWith("/shorts/") ||
    u.pathname.startsWith("/embed/")
   ){
    id=u.pathname.split("/")[2];
   }
  }

  return /^[a-zA-Z0-9_-]{11}$/.test(id||"")
   ? id : "";
 }catch(e){
  return "";
 }
}

function loadVideo(){
 let url=document.getElementById("video").value.trim();
 let id=getVideoId(url);
 let msg=document.getElementById("message");

 if(!id){
  msg.innerText="Please enter a valid YouTube link!";
  return;
 }

 videoId=id;

 document.getElementById("player").src=
 "https://www.youtube.com/embed/"+id;

 msg.innerText="Video loaded successfully! 🎬";
}

function setDuration(seconds,button){
 let start=Number(document.getElementById("start").value);

 document.getElementById("end").value=start+seconds;

 document.querySelectorAll(".quick button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 document.getElementById("message").innerText=
 seconds+" seconds selected!";
}

function previewClip(){
 let msg=document.getElementById("message");

 if(!videoId){
  msg.innerText="First load a YouTube video!";
  return;
 }

 let start=Number(document.getElementById("start").value);
 let end=Number(document.getElementById("end").value);

 if(start<0 || end<=start){
  msg.innerText="Please enter correct time!";
  return;
 }

 document.getElementById("player").src=
 "https://www.youtube.com/embed/"+videoId+
 "?start="+Math.floor(start)+
 "&end="+Math.floor(end)+
 "&autoplay=1";

 msg.innerText=
 "Your selected moment is ready for preview! ▶";
}
</script>

</body>
</html>
